name: Production Database Migrations

on:
  push:
    branches: [ "main" ]
    paths:
      - 'supabase/migrations/**'

jobs:
  migrate:
    runs-on: ubuntu-latest
    
    # Only run this job if the build passes, ensuring we don't migrate if code is broken
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Supabase CLI
      uses: supabase/setup-cli@v1
      with:
        version: latest

    - name: Link Supabase Project
      run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }} --password ${{ secrets.SUPABASE_DB_PASSWORD }}

    - name: Push Migrations
      run: supabase db push --password ${{ secrets.SUPABASE_DB_PASSWORD }}
